# ============================================================================
# WFM Platform — production compose
#
# Run every compose command from THIS folder (deploy/) and always pass the
# env file explicitly so ${...} interpolation below works:
#
#   docker compose --env-file ./prod.env -f docker-compose.prod.yml up -d --build
#
# Topology (single origin — the backend serves the SPA itself, main.ts:110-131):
#   internet → nginx (:80/:443) → backend (:3000, internal) → postgres / redis
#
# Networks:
#   edge     — nginx ↔ backend (and backend's outbound internet: SMTP, Anthropic API)
#   internal — backend ↔ postgres ↔ redis; `internal: true` = no internet access
# ============================================================================

name: wfm-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Host folder for nightly dumps — see backup/pg-backup.sh
      - ./backups:/backups
    ports:
      # Loopback ONLY (never public). Lets host-side admin tools reach the DB:
      # seed:admin (needs ts-node from the repo), psql spot-checks, pg-restore.
      # 5433 mirrors the dev convention. Remove this mapping to go fully sealed.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  redis:
    # Optional but recommended: socket.io Redis adapter for chat presence
    # (backend/src/common/adapters/redis-io.adapter.ts — activates when it can
    # reach REDIS_HOST:REDIS_PORT; falls back to in-memory if unreachable).
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    # No ports — internal only.

  backend:
    build:
      # Context is the REPO ROOT — the image needs backend/, frontend/ and
      # database/migrations/ (see backend.Dockerfile).
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: wfm-backend:latest
    restart: unless-stopped
    env_file: ./prod.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        # service_started, not healthy — the Redis adapter degrades gracefully
        # (redis-io.adapter.ts falls back to in-memory), so Redis must never
        # block backend startup.
        condition: service_started
    volumes:
      # main.ts:97 → uploads live at <cwd>/uploads = /app/backend/uploads
      - uploads:/app/backend/uploads
    healthcheck:
      # GET /api/v1/health — @Public, DB ping (health.controller.ts:9,17)
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [internal, edge]
    # No host ports — nginx is the only public entry point.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_started
    # Reload every 6h so renewed certificates are picked up.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done
      & nginx -g 'daemon off;'"
    networks: [edge]

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Renewal loop — checks twice a day; certbot only renews within 30 days
    # of expiry. First-time issuance is a one-off command (see DEPLOY_RUNBOOK.md).
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"

networks:
  edge:
  internal:
    internal: true   # no outbound internet for postgres/redis

volumes:
  pg_data:
  redis_data:
  uploads:
  certbot_www:
  certbot_conf:
