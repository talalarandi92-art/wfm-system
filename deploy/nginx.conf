# ============================================================================
# WFM Platform — nginx reverse proxy (mounted as /etc/nginx/conf.d/default.conf)
#
# Replace wfm.example.com with the real domain (3 places) once decided.
# TLS certs come from the certbot service (volumes certbot_conf / certbot_www).
# Everything proxies to the single backend origin — the backend serves the SPA,
# the API (/api/v1), /uploads and /socket.io itself (backend/src/main.ts).
# ============================================================================

# WebSocket upgrade helper (socket.io chat gateway)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream wfm_backend {
    server backend:3000;
    keepalive 32;
}

# ---- HTTP: ACME challenge + redirect everything else to HTTPS --------------
server {
    listen 80;
    server_name wfm.example.com;

    # Let's Encrypt webroot challenge (shared volume with the certbot service)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name wfm.example.com;

    ssl_certificate     /etc/letsencrypt/live/wfm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wfm.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Body size — the backend itself accepts 50 MB (main.ts:61 express.json
    # limit '50mb', for workbook imports / Sprinklr payloads / attachments).
    # nginx must not be the smaller pipe, so match it.
    client_max_body_size 50m;

    # Long-running exports (Excel report generation, recon rebuilds) can take
    # minutes — keep read timeout generous; send/connect stay tight.
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    300s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml font/ttf font/otf;

    # socket.io — WebSocket upgrade + long-lived connection
    location /socket.io/ {
        proxy_pass http://wfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # idle websocket must not be cut
        proxy_send_timeout 3600s;
    }

    # Everything else — API, /uploads, and the SPA (all served by the backend)
    location / {
        proxy_pass http://wfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Backend runs `trust proxy` (main.ts:58) — X-Forwarded-For gives it
        # the real client IP for throttling / audit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
