# ============================================================
# WFM PLATFORM — Docker Compose (Production)
# ============================================================
# Single-server deployment behind a domain with TLS.
#
#   1. Copy .env.production.example → .env and fill in real secrets + DOMAIN.
#   2. Issue TLS certs once (see DEPLOYMENT.md → "First-time TLS").
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# Services:
#   postgres  — data store (not exposed to the host)
#   redis     — cache / future socket.io adapter (not exposed)
#   backend   — NestJS API + chat gateway
#   frontend  — nginx: serves the SPA, terminates TLS, reverse-proxies API/WS
#   certbot   — Let's Encrypt cert issuance + renewal
# ============================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: wfm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema + seed auto-run on first start (empty volume only)
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [wfm_network]
    # No host port — only reachable inside the Docker network.

  redis:
    image: redis:7-alpine
    container_name: wfm_redis
    restart: unless-stopped
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [wfm_network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wfm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Persist uploaded files across container rebuilds
      - uploads_data:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [wfm_network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wfm_frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on: [backend]
    networks: [wfm_network]

  certbot:
    image: certbot/certbot
    container_name: wfm_certbot
    # Renews every 12h; nginx picks up renewed certs on its periodic reload.
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks: [wfm_network]

volumes:
  postgres_data: { driver: local }
  redis_data:    { driver: local }
  uploads_data:  { driver: local }

networks:
  wfm_network:
    driver: bridge
