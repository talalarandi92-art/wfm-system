name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # redis/typeorm have a known peer conflict — install the same way we do locally.
      # `npm install` (not `ci`) tolerates lockfile drift after dependency bumps.
      - run: npm install --legacy-peer-deps --no-fund --no-audit
      - run: npm run build
      - run: npm test
      # Non-blocking security report (does NOT run `audit fix --force`, which would
      # downgrade NestJS — see the security hardening notes).
      - run: npm audit --omit=dev || true

  frontend:
    name: Frontend — typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev || true
